<meta charset="utf-8">
<title>لوحة AdRadar</title>
<style>
:root{
  --bg:#F3F5F2;
  --surface:#FFFFFF;
  --surface-alt:#E7ECE7;
  --ink:#131714;
  --ink-soft:#4A5750;
  --border:#D2DAD1;
  --accent:#1B8F5C;
  --accent-ink:#0E5C39;
  --accent-soft:#E3F3EA;
  --warn:#B9701A;
  --warn-soft:#FBF0DF;
  --danger:#B84A3E;
  --danger-soft:#F8E7E4;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1310;
    --surface:#161C18;
    --surface-alt:#1E2620;
    --ink:#E9F1EA;
    --ink-soft:#A8B8AC;
    --border:#2B352E;
    --accent:#35C685;
    --accent-ink:#8FE6BB;
    --accent-soft:#15301F;
    --warn:#E2A03D;
    --warn-soft:#2E2412;
    --danger:#E17364;
    --danger-soft:#301A17;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1310;
  --surface:#161C18;
  --surface-alt:#1E2620;
  --ink:#E9F1EA;
  --ink-soft:#A8B8AC;
  --border:#2B352E;
  --accent:#35C685;
  --accent-ink:#8FE6BB;
  --accent-soft:#15301F;
  --warn:#E2A03D;
  --warn-soft:#2E2412;
  --danger:#E17364;
  --danger-soft:#301A17;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Segoe UI","Noto Sans Arabic",Tahoma,-apple-system,BlinkMacSystemFont,sans-serif;
  overflow:hidden;
}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:0.9em;}
a{color:var(--accent-ink);}
a:hover{color:var(--accent);}

.app{direction:rtl;height:100vh;display:flex;flex-direction:column;line-height:1.6;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);flex:none;gap:16px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
.brand span.name{font-size:19px;font-weight:800;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.last-updated{font-size:12.5px;color:var(--ink-soft);}
.btn-primary{display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0 18px;height:40px;font-size:13.5px;font-weight:700;cursor:pointer;}
.btn-primary:hover{filter:brightness(1.05);}
.btn-primary[disabled]{opacity:0.7;cursor:default;}
.spin{animation:spin 0.9s linear infinite;transform-origin:center;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

.body-row{display:flex;flex:1;min-height:0;}
.sidebar{width:216px;flex:none;border-inline-start:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.nav-btn{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:8px;border:none;background:transparent;color:var(--ink-soft);font-size:13.5px;font-weight:600;cursor:pointer;text-align:start;width:100%;}
.nav-btn:hover{background:var(--surface-alt);color:var(--ink);}
.nav-btn.active{background:var(--accent-soft);color:var(--accent-ink);}
.nav-btn svg{flex:none;}

.content{flex:1;overflow-y:auto;padding:26px 30px 40px;}
.screen-head{margin-bottom:20px;}
.screen-head h1{font-size:21px;margin:0 0 4px;font-weight:800;text-wrap:balance;}
.screen-head p{font-size:13.5px;color:var(--ink-soft);margin:0;max-width:60ch;}
.screen-head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px;}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.stat-card .value{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;}
.stat-card .label{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
.panel h2{font-size:15px;margin:0 0 12px;font-weight:800;display:flex;align-items:center;gap:8px;}

.ad-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.ad-row:last-child{border-bottom:none;}
.badge{flex:none;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:12.5px;border-radius:20px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.who{flex:none;font-size:12.5px;color:var(--ink-soft);width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.text{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.type-icon{flex:none;color:var(--ink-soft);}
.angle-pill{flex:none;font-size:11.5px;background:var(--surface-alt);color:var(--ink-soft);border-radius:6px;padding:2px 8px;white-space:nowrap;}
.save-btn{flex:none;background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:6px;border-radius:6px;display:flex;}
.save-btn:hover{background:var(--surface-alt);}
.save-btn.saved{color:var(--accent);}

.full-table{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px 20px;}
.full-table .ad-row{gap:14px;}
.rank{flex:none;width:22px;color:var(--ink-soft);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;}

.bar-row{margin-bottom:14px;}
.bar-row .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px;}
.bar-row .track{background:var(--surface-alt);border-radius:6px;height:9px;overflow:hidden;}
.bar-row .fill{background:var(--accent);height:100%;border-radius:6px;transition:width .25s ease;}

select.filter-select, input.form-input{border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--ink);font-size:13.5px;padding:0 12px;height:40px;font-family:inherit;}
select.filter-select:focus-visible, input.form-input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

.tab-row{display:flex;gap:8px;margin-bottom:18px;}
.tab-btn{border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);border-radius:20px;padding:0 16px;height:36px;font-size:13px;font-weight:600;cursor:pointer;}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.swipe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.swipe-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.swipe-thumb{height:120px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
.swipe-body{padding:12px 14px;}
.swipe-body .who{width:auto;margin-bottom:4px;}
.swipe-body .text{white-space:normal;font-size:13px;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.swipe-actions{display:flex;justify-content:space-between;align-items:center;}
.swipe-actions-right{display:flex;align-items:center;gap:2px;}
.unsave-btn{background:none;border:none;color:var(--danger);font-size:12.5px;font-weight:700;cursor:pointer;padding:4px;}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:5px;border-radius:6px;display:flex;}
.icon-btn:hover{background:var(--surface-alt);color:var(--ink);}
.empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:10px 18px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,0.25);opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:50;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

.alert-item{border-inline-start:3px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:12px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.alert-item.is-read{opacity:0.55;}
.alert-item .txt{font-size:13.5px;}
.alert-item .when{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.read-btn{flex:none;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink);font-family:inherit;}

.failure-item{border-inline-start:3px solid var(--danger);background:var(--danger-soft);border-radius:8px;padding:12px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.failure-item .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.dismiss-btn{flex:none;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink);font-family:inherit;}

.timeline{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px 24px 20px;}
.timeline-axis{position:relative;height:6px;background:var(--surface-alt);border-radius:4px;margin:0 4px 10px;}
.season-band{position:absolute;top:0;bottom:0;background:var(--warn-soft);border-radius:4px;}
.month-labels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);padding:0 2px;margin-bottom:26px;}
.comp-track{position:relative;height:34px;margin-bottom:6px;}
.comp-dot{position:absolute;top:50%;transform:translate(50%,-50%);width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--accent);}
.comp-track-label{position:absolute;top:50%;transform:translateY(-50%);font-size:12.5px;color:var(--ink-soft);right:0;}
.legend-row{display:flex;gap:18px;margin-top:18px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap;}
.legend-swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle;}

.comp-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.comp-card{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-size:13.5px;}
.comp-card .pid{color:var(--ink-soft);}
.add-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
.add-form h2{font-size:14px;margin:0 0 12px;}
.add-form-row{display:flex;gap:10px;flex-wrap:wrap;}
.add-form-row input{flex:1;min-width:180px;}
.add-btn{background:var(--ink);color:var(--bg);border:none;border-radius:8px;padding:0 20px;height:40px;font-size:13.5px;font-weight:700;cursor:pointer;flex:none;font-family:inherit;}

@media (max-width:900px){
  .stats-row{grid-template-columns:repeat(2,1fr);}
  .grid2{grid-template-columns:1fr;}
  .swipe-grid{grid-template-columns:repeat(2,1fr);}
  .sidebar{width:64px;}
  .sidebar .nav-btn span.label{display:none;}
}
</style>

<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var ICONS = {
    grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    flame: '<path d="M12 2c1 3-3 4-3 8a3 3 0 006 0c0-1-1-2-1-3 2 1 3 3 3 5a5 5 0 01-10 0c0-4 3-6 5-10z"/>',
    tag: '<path d="M20 12l-8 8-9-9V4h7l10 8z"/><circle cx="7.5" cy="7.5" r="1.1" fill="currentColor" stroke="none"/>',
    bookmark: '<path d="M6 3h12v18l-6-4-6 4V3z"/>',
    bell: '<path d="M6 8a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M9.5 19a2.5 2.5 0 005 0"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    warning: '<path d="M12 3l9.5 17H2.5L12 3z"/><path d="M12 10v5"/><circle cx="12" cy="17.6" r="0.9" fill="currentColor" stroke="none"/>',
    users: '<circle cx="9" cy="8" r="3"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6"/><circle cx="17" cy="9" r="2.3"/><path d="M16.2 13.2c3 0 5.8 1.6 5.8 5"/>',
    refresh: '<path d="M20 12a8 8 0 10-2.7 6"/><path d="M20 5v6h-6"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="10" r="1.4"/><path d="M21 16l-5-5-4 4-3-3-5 5"/>',
    video: '<rect x="3" y="5" width="15" height="14" rx="2"/><path d="M18 9l4-2v10l-4-2z"/>',
    carousel: '<rect x="2" y="6" width="14" height="12" rx="2"/><rect x="8" y="3" width="14" height="12" rx="2" opacity="0.5"/>',
    download: '<path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/>'
  };
  function icon(name, size, filled){
    size = size || 18;
    var fill = filled ? 'currentColor' : 'none';
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + fill + '" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg>';
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  var ANGLE_LABELS = {
    discount: 'خصم', testimonial: 'شهادة عميل', problem_solution: 'حل مشكلة',
    fomo: 'خوف من فوات الفرصة', comparison: 'مقارنة', other: 'أخرى'
  };

  var ADS_RAW = [
    { id: 1, compId: 1, days: 62, angle: 'fomo', type: 'video', text: 'باقي كمية محدودة من التخفيض الكبير — اطلب قبل النفاذ', mediaUrl: 'https://example.com/ads/snapshot/fx_001' },
    { id: 2, compId: 2, days: 47, angle: 'testimonial', type: 'image', text: 'شهادة حقيقية من عميلة استخدمت المنتج لمدة شهرين', mediaUrl: 'https://example.com/ads/snapshot/fx_002' },
    { id: 3, compId: 1, days: 38, angle: 'discount', type: 'carousel', text: 'خصم يصل إلى 40% على تشكيلة الخريف الجديدة', mediaUrl: 'https://example.com/ads/snapshot/fx_003' },
    { id: 4, compId: 3, days: 29, angle: 'problem_solution', type: 'video', text: 'تعبان من نفس الروتين؟ جرب الحل في 7 أيام', mediaUrl: 'https://example.com/ads/snapshot/fx_004' },
    { id: 5, compId: 2, days: 21, angle: 'comparison', type: 'image', text: 'قارن بنفسك: قبل وبعد استخدام المنتج', mediaUrl: 'https://example.com/ads/snapshot/fx_005' },
    { id: 6, compId: 3, days: 14, angle: 'discount', type: 'image', text: 'عرض نهاية الأسبوع — خصم 25% على كل الطلبات', mediaUrl: 'https://example.com/ads/snapshot/fx_006' },
    { id: 7, compId: 1, days: 9, angle: 'testimonial', type: 'video', text: 'تجربتي الكاملة مع المنتج بعد شهر من الاستخدام', mediaUrl: 'https://example.com/ads/snapshot/fx_007' },
    { id: 8, compId: 2, days: 5, angle: 'fomo', type: 'carousel', text: 'آخر فرصة قبل انتهاء العرض الليلة', mediaUrl: 'https://example.com/ads/snapshot/fx_008' },
    { id: 9, compId: 3, days: 3, angle: 'other', type: 'image', text: 'تعرف على فريقنا وقصة بداية المشروع', mediaUrl: 'https://example.com/ads/snapshot/fx_009' }
  ];
  var FAILURES_RAW = [
    { id: 101, compId: 2, days: 2, angle: 'discount', disappeared: 'قبل 3 أيام' },
    { id: 102, compId: 1, days: 1, angle: 'other', disappeared: 'قبل يومين' },
    { id: 103, compId: 3, days: 3, angle: 'comparison', disappeared: 'قبل يوم' }
  ];
  var ALERTS_RAW = [
    { id: 201, compId: 3, detail: 'فاست فيت: 11 إعلان جديد هذا الأسبوع مقابل متوسط 3.2', when: 'قبل ساعتين' },
    { id: 202, compId: 1, detail: 'متجر لمسة: أول ظهور لعرض موسمي جديد', when: 'أمس' },
    { id: 203, compId: 2, detail: 'بيوتي هب: زيادة 3 أضعاف في عدد الإعلانات النشطة', when: 'قبل يومين' }
  ];
  var CALENDAR_META = [
    { compId: 1, pct: 15, monthLabel: 'منتصف يناير' },
    { compId: 2, pct: 42, monthLabel: 'أوائل يونيو' },
    { compId: 3, pct: 88, monthLabel: 'منتصف نوفمبر' }
  ];

  var state = {
    screen: 'overview',
    isRefreshing: false,
    lastUpdated: 'قبل 3 ساعات',
    angleFilter: 'all',
    swipeFilter: 'all',
    savedIds: { 1: true, 2: true },
    readAlerts: { 203: true },
    dismissedFailures: {},
    competitors: [
      { id: 1, name: 'متجر لمسة', pageId: '284193822' },
      { id: 2, name: 'بيوتي هب', pageId: '193204471' },
      { id: 3, name: 'فاست فيت', pageId: '771208834' }
    ],
    newCompName: '',
    newCompPageId: ''
  };

  function compName(id){
    var c = state.competitors.filter(function(c){ return c.id === id; })[0];
    return c ? c.name : '';
  }

  function setState(patch){
    Object.assign(state, patch);
    render();
  }

  // ---------- screen renderers ----------

  function navItem(id, iconName, label){
    var active = state.screen === id;
    return '<button class="nav-btn' + (active ? ' active' : '') + '" data-action="nav" data-id="' + id + '">' +
      icon(iconName, 18) + '<span class="label">' + label + '</span></button>';
  }

  function typeIcon(type, size){
    return icon(type, size || 16);
  }

  function overviewScreen(){
    var sorted = ADS_RAW.slice().sort(function(a,b){ return b.days - a.days; }).slice(0,3);
    var alerts = ALERTS_RAW.filter(function(a){ return !state.readAlerts[a.id]; }).slice(0,2);
    var alertsToShow = alerts.length ? alerts : ALERTS_RAW.slice(0,2);
    var failures = FAILURES_RAW.filter(function(f){ return !state.dismissedFailures[f.id]; }).slice(0,2);

    var stats = {
      competitors: state.competitors.length,
      activeAds: ADS_RAW.length,
      trackedAds: ADS_RAW.length + FAILURES_RAW.length,
      failedAds: FAILURES_RAW.filter(function(f){ return !state.dismissedFailures[f.id]; }).length
    };

    return '' +
    '<div class="screen-head"><h1>نظرة عامة</h1><p>ملخص سريع لكل المنافسين المراقَبين وأهم ما تغيّر مؤخراً.</p></div>' +
    '<div class="stats-row">' +
      '<div class="stat-card"><div class="value">' + stats.competitors + '</div><div class="label">منافسون مراقَبون</div></div>' +
      '<div class="stat-card"><div class="value">' + stats.activeAds + '</div><div class="label">إعلان نشط الآن</div></div>' +
      '<div class="stat-card"><div class="value">' + stats.trackedAds + '</div><div class="label">إجمالي إعلانات متتبَّعة</div></div>' +
      '<div class="stat-card"><div class="value">' + stats.failedAds + '</div><div class="label">إعلان في قائمة الفشل</div></div>' +
    '</div>' +
    '<div class="grid2">' +
      '<div class="panel"><h2>🔥 الإعلانات الأطول عمراً</h2>' +
        sorted.map(function(ad){
          return '<div class="ad-row"><span class="badge">' + ad.days + ' يوم</span><span class="who">' + esc(compName(ad.compId)) + '</span><span class="text">' + esc(ad.text) + '</span></div>';
        }).join('') +
      '</div>' +
      '<div class="panel"><h2>أحدث التنبيهات</h2>' +
        alertsToShow.map(function(a){
          return '<div class="alert-item"><div><div class="txt">' + esc(a.detail) + '</div><div class="when">' + esc(a.when) + '</div></div></div>';
        }).join('') +
        '<h2 style="margin-top:16px">أحدث الإعلانات الفاشلة</h2>' +
        failures.map(function(f){
          return '<div class="failure-item"><div><div class="txt">' + esc(compName(f.compId)) + ' — عمر ' + f.days + ' يوم</div><div class="meta">اختفى ' + esc(f.disappeared) + '</div></div></div>';
        }).join('') +
      '</div>' +
    '</div>';
  }

  function longevityScreen(){
    var sorted = ADS_RAW.slice().sort(function(a,b){ return b.days - a.days; });
    return '' +
    '<div class="screen-head"><h1>🔥 متتبع الإعلانات طويلة العمر</h1><p>مرتّبة حسب عدد الأيام منذ أول ظهور. طول العمر إشارة قوية على إعلان رابح.</p></div>' +
    '<div class="full-table">' +
      sorted.map(function(ad, i){
        var saved = !!state.savedIds[ad.id];
        return '<div class="ad-row">' +
          '<span class="rank">' + (i+1) + '</span>' +
          '<span class="badge">' + ad.days + ' يوم</span>' +
          '<span class="type-icon">' + typeIcon(ad.type) + '</span>' +
          '<span class="who">' + esc(compName(ad.compId)) + '</span>' +
          '<span class="text">' + esc(ad.text) + '</span>' +
          '<span class="angle-pill">' + ANGLE_LABELS[ad.angle] + '</span>' +
          '<button class="save-btn" data-action="download-media" data-id="' + ad.id + '" title="تنزيل الوسائط">' + icon('download', 17) + '</button>' +
          '<button class="save-btn' + (saved ? ' saved' : '') + '" data-action="toggle-save" data-id="' + ad.id + '" title="حفظ في بنك الأفكار">' + icon('bookmark', 17, saved) + '</button>' +
        '</div>';
      }).join('') +
    '</div>';
  }

  function anglesScreen(){
    var filtered = state.angleFilter === 'all' ? ADS_RAW : ADS_RAW.filter(function(a){ return String(a.compId) === state.angleFilter; });
    var counts = {};
    filtered.forEach(function(a){ counts[a.angle] = (counts[a.angle]||0) + 1; });
    var total = filtered.length || 1;
    var rows = Object.keys(counts).map(function(angle){
      var pct = Math.round((counts[angle] / total) * 1000) / 10;
      return { angle: angle, label: ANGLE_LABELS[angle], pct: pct };
    }).sort(function(a,b){ return b.pct - a.pct; });

    var options = '<option value="all">كل المنافسين</option>' + state.competitors.map(function(c){
      return '<option value="' + c.id + '"' + (state.angleFilter === String(c.id) ? ' selected' : '') + '>' + esc(c.name) + '</option>';
    }).join('');

    return '' +
    '<div class="screen-head-row">' +
      '<div class="screen-head"><h1>محلل الزوايا</h1><p>توزيع أنواع الرسائل الإعلانية عبر الإعلانات المصنَّفة.</p></div>' +
      '<select class="filter-select" data-action="angle-filter">' + options + '</select>' +
    '</div>' +
    '<div class="panel">' +
      (rows.length ? rows.map(function(row){
        return '<div class="bar-row"><div class="top"><span>' + row.label + '</span><span class="ltr">' + row.pct + '%</span></div><div class="track"><div class="fill" style="width:' + row.pct + '%"></div></div></div>';
      }).join('') : '<div class="empty-state">مفيش إعلانات لهذا المنافس.</div>') +
    '</div>';
  }

  function swipeScreen(){
    var saved = ADS_RAW.filter(function(a){ return !!state.savedIds[a.id]; });
    var shown = state.swipeFilter === 'all' ? saved : saved.filter(function(a){ return a.type === state.swipeFilter; });

    function tab(id, label){
      return '<button class="tab-btn' + (state.swipeFilter === id ? ' active' : '') + '" data-action="swipe-filter" data-id="' + id + '">' + label + '</button>';
    }

    return '' +
    '<div class="screen-head"><h1>بنك الأفكار الذكي</h1><p>الإعلانات اللي حفظتها كأفكار — منظّمة حسب نوع الإبداع.</p></div>' +
    '<div class="tab-row">' + tab('all','الكل') + tab('image','صورة') + tab('video','فيديو') + tab('carousel','كاروسيل') + '</div>' +
    (shown.length ?
      '<div class="swipe-grid">' + shown.map(function(ad){
        return '<div class="swipe-card">' +
          '<div class="swipe-thumb">' + typeIcon(ad.type, 26) + '</div>' +
          '<div class="swipe-body">' +
            '<div class="who">' + esc(compName(ad.compId)) + '</div>' +
            '<div class="text">' + esc(ad.text) + '</div>' +
            '<div class="swipe-actions">' +
              '<span class="angle-pill">' + ANGLE_LABELS[ad.angle] + '</span>' +
              '<span class="swipe-actions-right">' +
                '<button class="icon-btn" data-action="download-media" data-id="' + ad.id + '" title="تنزيل الوسائط">' + icon('download', 15) + '</button>' +
                '<button class="unsave-btn" data-action="toggle-save" data-id="' + ad.id + '">إزالة</button>' +
              '</span>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>'
      : '<div class="empty-state">لسه ما حفظتش أي إعلان من هذا النوع — من شاشة "طول العمر" دوس على أيقونة الحفظ.</div>'
    );
  }

  function alertsScreen(){
    return '' +
    '<div class="screen-head"><h1>تنبيهات الترندات</h1><p>قفزات غير طبيعية في عدد إعلانات منافس خلال أسبوع.</p></div>' +
    ALERTS_RAW.map(function(a){
      var read = !!state.readAlerts[a.id];
      return '<div class="alert-item' + (read ? ' is-read' : '') + '">' +
        '<div><div class="txt">' + esc(a.detail) + '</div><div class="when">' + esc(a.when) + '</div></div>' +
        '<button class="read-btn" data-action="mark-read" data-id="' + a.id + '">' + (read ? 'مقروء' : 'تعليم كمقروء') + '</button>' +
      '</div>';
    }).join('');
  }

  function calendarScreen(){
    var rows = CALENDAR_META.map(function(row){
      return '<div class="comp-track"><span class="comp-track-label">' + esc(compName(row.compId)) + '</span><span class="comp-dot" style="right:' + row.pct + '%" title="' + esc(row.monthLabel) + '"></span></div>';
    }).join('');

    return '' +
    '<div class="screen-head"><h1>تقويم الحملات</h1><p>متى بدأ كل منافس حملته بالنسبة للمواسم الرئيسية.</p></div>' +
    '<div class="timeline">' +
      '<div class="timeline-axis"><div class="season-band" style="right:11%;width:9%"></div><div class="season-band" style="right:89%;width:6%"></div></div>' +
      '<div class="month-labels"><span>يناير</span><span>فبراير</span><span>مارس</span><span>أبريل</span><span>مايو</span><span>يونيو</span><span>يوليو</span><span>أغسطس</span><span>سبتمبر</span><span>أكتوبر</span><span>نوفمبر</span><span>ديسمبر</span></div>' +
      rows +
      '<div class="legend-row"><span><span class="legend-swatch" style="background:var(--warn-soft);border:1px solid var(--warn)"></span>موسم (رمضان / الجمعة البيضاء)</span><span><span class="legend-swatch" style="background:var(--accent)"></span>أول ظهور لحملة منافس</span></div>' +
    '</div>';
  }

  function failuresScreen(){
    var items = FAILURES_RAW.filter(function(f){ return !state.dismissedFailures[f.id]; });
    return '' +
    '<div class="screen-head"><h1>قائمة الإعلانات الفاشلة</h1><p>إعلانات اختفت خلال أقل من 5 أيام — نمط لا يستحق التكرار.</p></div>' +
    (items.length ? items.map(function(f){
      return '<div class="failure-item"><div><div class="txt">' + esc(compName(f.compId)) + ' — عمر ' + f.days + ' يوم — ' + ANGLE_LABELS[f.angle] + '</div><div class="meta">اختفى ' + esc(f.disappeared) + '</div></div><button class="dismiss-btn" data-action="dismiss-failure" data-id="' + f.id + '">تجاهل</button></div>';
    }).join('') : '<div class="empty-state">مفيش إعلانات فاشلة معلّقة حالياً.</div>');
  }

  function competitorsScreen(){
    return '' +
    '<div class="screen-head"><h1>المنافسون</h1><p>إدارة قائمة المنافسين المراقَبين عبر مكتبات الإعلانات.</p></div>' +
    '<div class="comp-list">' +
      state.competitors.map(function(c){
        return '<div class="comp-card"><span>' + esc(c.name) + '</span><span class="pid ltr">' + esc(c.pageId) + '</span></div>';
      }).join('') +
    '</div>' +
    '<div class="add-form"><h2>إضافة منافس جديد</h2>' +
      '<div class="add-form-row">' +
        '<input class="form-input" type="text" placeholder="اسم المنافس" id="newCompName" value="' + esc(state.newCompName) + '">' +
        '<input class="form-input" type="text" placeholder="معرّف صفحة فيسبوك" id="newCompPageId" value="' + esc(state.newCompPageId) + '">' +
        '<button class="add-btn" data-action="add-competitor">إضافة</button>' +
      '</div>' +
    '</div>';
  }

  var SCREENS = {
    overview: overviewScreen, longevity: longevityScreen, angles: anglesScreen,
    swipe: swipeScreen, alerts: alertsScreen, calendar: calendarScreen,
    failures: failuresScreen, competitors: competitorsScreen
  };

  function render(){
    var refreshIcon = icon('refresh', 16);
    var html = '' +
    '<div class="topbar">' +
      '<div class="brand"><span class="dot"></span><span class="name">AdRadar</span></div>' +
      '<div class="topbar-right">' +
        '<span class="last-updated">آخر تحديث: ' + esc(state.lastUpdated) + '</span>' +
        '<button class="btn-primary" data-action="refresh"' + (state.isRefreshing ? ' disabled' : '') + '>' +
          '<span class="' + (state.isRefreshing ? 'spin' : '') + '">' + refreshIcon + '</span>' +
          '<span>تحديث البيانات الآن</span>' +
        '</button>' +
      '</div>' +
    '</div>' +
    '<div class="body-row">' +
      '<div class="sidebar">' +
        navItem('overview','grid','نظرة عامة') +
        navItem('longevity','flame','طول العمر') +
        navItem('angles','tag','محلل الزوايا') +
        navItem('swipe','bookmark','بنك الأفكار') +
        navItem('alerts','bell','تنبيهات الترندات') +
        navItem('calendar','calendar','تقويم الحملات') +
        navItem('failures','warning','قائمة الفشل') +
        navItem('competitors','users','المنافسون') +
      '</div>' +
      '<div class="content">' + SCREENS[state.screen]() + '</div>' +
    '</div>';
    document.getElementById('app').innerHTML = html;

    var nameInput = document.getElementById('newCompName');
    var pidInput = document.getElementById('newCompPageId');
    if (nameInput) nameInput.addEventListener('input', function(e){ state.newCompName = e.target.value; });
    if (pidInput) pidInput.addEventListener('input', function(e){ state.newCompPageId = e.target.value; });
    var angleSelect = document.querySelector('[data-action="angle-filter"]');
    if (angleSelect) angleSelect.addEventListener('change', function(e){ setState({ angleFilter: e.target.value }); });
  }

  document.getElementById('app').addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    var id = el.getAttribute('data-id');

    if (action === 'nav') { setState({ screen: id }); }
    else if (action === 'toggle-save') {
      var next = Object.assign({}, state.savedIds);
      next[id] = !next[id];
      setState({ savedIds: next });
    }
    else if (action === 'mark-read') {
      var nextR = Object.assign({}, state.readAlerts);
      nextR[id] = true;
      setState({ readAlerts: nextR });
    }
    else if (action === 'dismiss-failure') {
      var nextD = Object.assign({}, state.dismissedFailures);
      nextD[id] = true;
      setState({ dismissedFailures: nextD });
    }
    else if (action === 'swipe-filter') { setState({ swipeFilter: id }); }
    else if (action === 'refresh') {
      if (state.isRefreshing) return;
      setState({ isRefreshing: true });
      setTimeout(function(){ setState({ isRefreshing: false, lastUpdated: 'الآن' }); }, 900);
    }
    else if (action === 'add-competitor') {
      var name = (state.newCompName || '').trim();
      var pid = (state.newCompPageId || '').trim();
      if (!name || !pid) return;
      var nextC = state.competitors.concat([{ id: Date.now(), name: name, pageId: pid }]);
      setState({ competitors: nextC, newCompName: '', newCompPageId: '' });
    }
    else if (action === 'download-media') {
      var ad = ADS_RAW.filter(function(a){ return String(a.id) === id; })[0];
      if (!ad) return;
      window.open(ad.mediaUrl, '_blank', 'noopener');
      showToast('بيتفتح مصدر الوسائط في تبويب جديد — التنزيل المباشر للملف شغّال من النسخة المتصلة بالباك إند الحقيقي');
    }
  });

  var toastTimer = null;
  function showToast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 3200);
  }

  render();
})();
</script>

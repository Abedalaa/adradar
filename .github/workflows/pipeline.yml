# Runs the AdRadar pipeline on GitHub's runners, because the cPanel shared
# host can't install Playwright/Chromium (see deploy/CPANEL.md). The runner
# borrows the live database over the app's own /sync/db endpoint, updates it,
# and hands it back; the dashboard keeps serving it and never knows the
# difference. FTP would have been the obvious transport, but the host
# firewalls port 21 off from outside; HTTPS is what actually gets through.

name: AdRadar pipeline

on:
  schedule:
    # Every 12 hours, matching deploy/adradar-pipeline.timer.
    - cron: "0 */12 * * *"
  workflow_dispatch: {}   # lets you trigger a run by hand from the Actions tab

# Two runs writing the same remote database would race and lose data.
concurrency:
  group: adradar-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SYNC_URL: ${{ secrets.SYNC_URL }}
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      # Tracked pages are Palestinian, and Meta geo-classifies West Bank
      # advertisers under either country — the scraper searches both and
      # merges. Searching EG returned zero ads for every competitor.
      # Override without editing this file by setting a repository variable.
      SCRAPE_COUNTRIES: ${{ vars.SCRAPE_COUNTRIES || 'IL,PS' }}
      AD_REACHED_COUNTRIES: ${{ vars.AD_REACHED_COUNTRIES || 'IL,PS' }}
      DATABASE_URL: sqlite:///adradar.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Fetch the live database
        run: python tools/sync_db.py download

      # create_all is a no-op against the downloaded database, and the
      # thing that makes a first run work at all: the CLI's `pipeline`
      # command queries tables directly and never calls init_db() itself
      # (only the web app's create_app does), so a fresh database would
      # otherwise fail with "no such table: competitors".
      - name: Ensure schema exists
        run: python main.py init-db

      - name: Run pipeline
        run: python main.py pipeline

      - name: Publish the updated database
        run: python tools/sync_db.py upload

      # A run that scrapes nothing still "succeeds" — Meta serving a
      # block/CAPTCHA page to a datacenter IP looks identical to an
      # advertiser with no ads. Keep the DB around so that's diagnosable.
      - name: Keep a copy for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adradar-db
          path: adradar.db
          retention-days: 7
          if-no-files-found: warn

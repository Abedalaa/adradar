# Runs the AdRadar pipeline on GitHub's runners, because the cPanel shared
# host can't install Playwright/Chromium (see deploy/CPANEL.md). The runner
# borrows the live database, updates it, and hands it back; the dashboard
# on cPanel keeps serving it and never knows the difference.

name: AdRadar pipeline

on:
  schedule:
    # Every 12 hours, matching deploy/adradar-pipeline.timer.
    - cron: "0 */12 * * *"
  workflow_dispatch: {}   # lets you trigger a run by hand from the Actions tab

# Two runs writing the same remote database would race and lose data.
concurrency:
  group: adradar-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_DIR: ${{ secrets.FTP_DIR }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      SCRAPE_COUNTRIES: ${{ vars.SCRAPE_COUNTRIES || 'EG' }}
      AD_REACHED_COUNTRIES: ${{ vars.AD_REACHED_COUNTRIES || 'EG' }}
      DATABASE_URL: sqlite:///adradar.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Fetch the live database
        run: python tools/sync_db.py download

      - name: Run pipeline
        run: python main.py pipeline

      - name: Publish the updated database
        run: python tools/sync_db.py upload

      # A run that scrapes nothing still "succeeds" — Meta serving a
      # block/CAPTCHA page to a datacenter IP looks identical to an
      # advertiser with no ads. Keep the DB around so that's diagnosable.
      - name: Keep a copy for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adradar-db
          path: adradar.db
          retention-days: 7
          if-no-files-found: warn
